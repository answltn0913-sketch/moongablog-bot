name: 24h Blog Auto Mailer

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-blog-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 패키지 설치
        run: |
          pip install google-generativeai

      - name: 3대 블로그 패키지 생성 및 메일 발송
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python main.py
